# One-time documentation bookkeeping; removed before PR handoff.
# This job writes only the two explicitly named ticket documents on this branch.
name: Record EFA-017 qualification
on:
  push:
    branches: ['feat/efa-017-football-tag-taxonomy']
    paths: ['.github/workflows/efa-017-record.yml']
permissions:
  contents: read
jobs:
  record:
    if: github.repository == 'mfreeze77/exais-football-ai' && github.ref == 'refs/heads/feat/efa-017-football-tag-taxonomy'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Update exactly EFA-017 without replacing other roadmap entries
        run: |
          test "$(git rev-parse HEAD^)" = 'd99824fe11e90e383a83c47e70d6bb7645f4554d'
          python3 - <<'PY'
          from pathlib import Path
          import copy, hashlib, json
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          p = Path('docs/tickets/catalog.json')
          q = Path('docs/tickets/EFA-017.md')
          assert blob(p.read_bytes()) == '0ae04b247046cc50ca986121d25d8459f8868a6a'
          assert blob(q.read_bytes()) == 'a47be729629c36ec06be5603560d47adbc30f28d'
          catalog = json.loads(p.read_text())
          before = copy.deepcopy(catalog)
          target = next(t for t in catalog['tickets'] if t['id'] == 'EFA-017')
          assert target['status'] == 'in_progress'
          evidence = [
              'Qualified implementation: d99824fe11e90e383a83c47e70d6bb7645f4554d; PR #50 remains open and unmerged.',
              'GitHub Actions run 38347274235 passed Python 3.11/3.12, all 124 Python tests, installed-wheel checks, and the original plus EFA-017 Firefox workflow.',
              'All five acceptance checks map to executed tests in docs/EFA017_QUALIFICATION.md; usage and API are documented in docs/TAG_TAXONOMY.md.'
          ]
          target['status'] = 'implemented'
          target['evidence'] = evidence
          assert [t for t in catalog['tickets'] if t['id'] != 'EFA-017'] == [t for t in before['tickets'] if t['id'] != 'EFA-017']
          p.write_text(json.dumps(catalog, indent=2, ensure_ascii=False) + '\n')
          body = q.read_text().replace('**Status:** in_progress', '**Status:** implemented').replace('- [ ]', '- [x]')
          start = body.index('## Implementation and qualification evidence\n')
          end = body.index('\nStatus meanings', start)
          body = body[:start] + '## Implementation and qualification evidence\n\n' + ''.join('- ' + item + '\n' for item in evidence) + body[end:]
          q.write_text(body)
          assert blob(p.read_bytes()) == '0270c7e6ef4c4641ffdd9009bb2f7acbb51c579e'
          assert blob(q.read_bytes()) == 'e142292042f571612a24e6d33669b72b5f604439'
          print('Recorded only EFA-017 status and executed acceptance evidence.')
          PY
          python3 docs/tickets/validate.py
          git diff --check
      - name: Commit the two documentation updates on the existing feature branch
        run: |
          branch='feat/efa-017-football-tag-taxonomy'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$GITHUB_SHA"
          git add -- docs/tickets/catalog.json docs/tickets/EFA-017.md
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'EFA-017: record all five qualified acceptance checks in the ticket catalog'
          git push origin "HEAD:refs/heads/$branch"
