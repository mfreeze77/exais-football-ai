# One-time exact-tree delivery. This workflow and transport files remove themselves.
name: EFA-017 verified candidate delivery
on:
  push:
    branches: ['feat/efa-017-football-tag-taxonomy']
    paths:
      - '_delivery/efa-017-*'
      - '.github/workflows/efa-017-delivery.yml'
permissions:
  contents: read
concurrency:
  group: efa-017-candidate-delivery
  cancel-in-progress: false
jobs:
  deliver:
    if: github.repository == 'mfreeze77/exais-football-ai' && github.ref == 'refs/heads/feat/efa-017-football-tag-taxonomy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify transport and the complete intended source tree
        run: |
          test "$(git rev-parse HEAD^)" = '114c8d5cc827b5d9d82d23c64f46c192ad638cca'
          python - <<'PY'
          import base64, gzip, hashlib, os, pathlib
          parts = [pathlib.Path(f'_delivery/efa-017-{i}.b64').read_text().strip() for i in (1, 2, 3)]
          assert parts[0].count('leKKkeIvOG') == 1
          parts[0] = parts[0].replace('leKKkeIvOG', 'leKkeIvOG', 1)
          encoded = ''.join(parts) + '\n'
          assert hashlib.sha256(encoded.encode()).hexdigest() == 'cbd2d9ba5d2b7e61d80183ff822a2b44398f1b1ce1f3e4cc9a6174675a3e2961'
          patch = gzip.decompress(base64.b64decode(encoded.strip(), validate=True))
          assert len(patch) == 133243
          assert hashlib.sha256(patch).hexdigest() == 'ffd24b12198117e495156a8851cb85629d01d5c4df0adca40e31bd2b1e7184b7'
          pathlib.Path(os.environ['RUNNER_TEMP'], 'efa-017.patch').write_bytes(patch)
          print('Verified exact EFA-017 patch bytes.')
          PY
          git apply --index --check "$RUNNER_TEMP/efa-017.patch"
          git apply --index "$RUNNER_TEMP/efa-017.patch"
          git apply --index --check _delivery/efa-017-wal.patch
          git apply --index _delivery/efa-017-wal.patch
          git rm -- .github/workflows/efa-017-delivery.yml _delivery/efa-017-1.b64 _delivery/efa-017-2.b64 _delivery/efa-017-3.b64 _delivery/efa-017-wal.patch
          test "$(git write-tree)" = '5fbf8df2d1e3a113ac6f31178698a1efecbe3f8a'
          git archive --format=tar.gz --output="$RUNNER_TEMP/efa-017-verified-source.tar.gz" "$(git write-tree)"
      - name: Qualify the candidate in the locked Python environment
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install uv
          uv sync --locked --extra dev --python python
          uv run ruff check .
          uv run ruff format --check src tests scripts docs/tickets/validate.py
          uv run python docs/tickets/validate.py
          uv run pytest -q
          uv run python -m build
          python scripts/check_wheel.py
      - name: Publish only the existing feature branch without overwriting concurrent work
        run: |
          branch='feat/efa-017-football-tag-taxonomy'
          remote_head="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          test "$remote_head" = "$GITHUB_SHA"
          git diff --exit-code
          test "$(git write-tree)" = '5fbf8df2d1e3a113ac6f31178698a1efecbe3f8a'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'EFA-017: implement complete tag groups, presets, aliases, and reviewed migrations' -m 'Exact verified source tree 5fbf8df2d1e3a113ac6f31178698a1efecbe3f8a. Qualifies locked Python tests and build, including bounded WAL startup-race recovery. Removes the one-time delivery workflow and transport. Full browser/matrix checks remain the draft PR gate.'
          git push origin "HEAD:refs/heads/$branch"
          git log -1 --format='%H %T' > "$RUNNER_TEMP/efa-017-published-revision.txt"
      - name: Retain delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: efa-017-delivery-evidence
          path: |
            ${{ runner.temp }}/efa-017-verified-source.tar.gz
            ${{ runner.temp }}/efa-017-published-revision.txt
          retention-days: 3
          if-no-files-found: ignore
